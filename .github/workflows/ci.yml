name: CI - Smart Parking

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Kiem thu end-to-end (36 checkpoint)
    runs-on: ubuntu-latest

    services:
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat phu thuoc Node
        working-directory: backend
        run: npm ci

      - name: Cai dat phu thuoc Python
        run: pip install paho-mqtt

      - name: Kiem tra syntax firmware (Arduino)
        run: |
          # Firmware .ino chay tren Wokwi - kiem tra bang regex co ban cho cac ky tu can thiet
          grep -q "void setup()" esp32/parking_firmware.ino
          grep -q "void loop()" esp32/parking_firmware.ino
          grep -q "PubSubClient" esp32/parking_firmware.ino
          echo "Firmware OK"

      - name: Kiem tra syntax backend
        working-directory: backend
        run: node --check server.js

      - name: Bat backend
        run: |
          cd backend
          nohup node server.js > ../backend_ci.log 2>&1 &
          echo $! > ../backend.pid
          sleep 5
          curl -s http://localhost:3000/api/health

      - name: Chay bo kiem thu tu dong
        run: python simulator/test_suite.py

      - name: Dung backend
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi

      - name: Luu log backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend_ci.log

  build-app:
    name: Bundle React Native (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai dat phu thuoc
        working-directory: app
        run: npm ci

      - name: Kiem tra syntax JSX
        working-directory: app
        run: |
          npx --yes @babel/parser --plugins jsx src/App.js > /dev/null
          npx --yes @babel/parser src/api.js > /dev/null
          npx --yes @babel/parser src/parkingMqtt.js > /dev/null
          echo "App source OK"
