name: CI - Smart Parking

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Kiem thu end-to-end (36 checkpoint)
    runs-on: ubuntu-latest

    env:
      MQTT_USER: ""
      MQTT_PASS: ""
      MQTT_HOST: localhost
      MQTT_PORT: "1883"
      PARKING_API: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat phu thuoc Node
        working-directory: backend
        run: npm ci

      - name: Cai dat phu thuoc Python
        run: pip install paho-mqtt

      - name: Kiem tra syntax firmware (Arduino)
        run: |
          grep -q "void setup()" esp32/parking_firmware.ino
          grep -q "void loop()" esp32/parking_firmware.ino
          grep -q "PubSubClient" esp32/parking_firmware.ino
          echo "Firmware OK"

      - name: Kiem tra syntax backend
        working-directory: backend
        run: node --check server.js

      - name: Kiem tra JSON + ACL broker
        run: |
          python -c "import json; json.load(open('esp32/diagram.json')); print('diagram.json OK')"
          test -f broker/acl.conf && echo "ACL OK"

      - name: Bat broker Mosquitto
        run: |
          docker run -d --name parking-mosquitto-ci \
            -p 1883:1883 -p 9001:9001 \
            -v "$PWD/broker/config/ci-mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0
          for i in $(seq 1 20); do
            if docker exec parking-mosquitto-ci mosquitto_sub -h localhost -p 1883 -t 'health' -C 1 -W 2; then break; fi
            sleep 1
          done

      - name: Bat backend
        run: |
          cd backend
          nohup node server.js > ../backend_ci.log 2>&1 &
          echo $! > ../backend.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -s http://localhost:3000/api/health

      - name: Chay bo kiem thu tu dong
        run: python simulator/test_suite.py

      - name: Dung backend + broker
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
          docker rm -f parking-mosquitto-ci || true

      - name: Luu log backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend_ci.log

  build-app:
    name: Bundle React Native (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai dat phu thuoc
        working-directory: app
        run: npm ci

      - name: Kiem tra syntax JSX
        working-directory: app
        run: node scripts/checkSyntax.js
