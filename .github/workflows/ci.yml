name: CI - Smart Parking

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Kiem thu end-to-end (39 checkpoint)
    runs-on: ubuntu-latest

    env:
      # Broker local dung xac thuc user/pass (xem broker/config/passwd)
      MQTT_USER: esp32
      MQTT_PASS: esp32123
      MQTT_HOST: localhost
      MQTT_PORT: "1883"
      BROKER_HOST: 127.0.0.1
      PARKING_API: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat phu thuoc Node
        working-directory: backend
        run: npm ci

      - name: Cai dat phu thuoc Python
        run: pip install paho-mqtt cryptography

      - name: Kiem tra syntax firmware (Arduino)
        run: |
          grep -q "void setup()" esp32/parking_firmware.ino
          grep -q "void loop()" esp32/parking_firmware.ino
          grep -q "PubSubClient" esp32/parking_firmware.ino
          grep -q "MQTT_USE_TLS" esp32/parking_firmware.ino
          echo "Firmware OK"

      - name: Kiem tra syntax backend
        working-directory: backend
        run: |
          node --check server.js
          node --check mqttWsBridge.js

      - name: Kiem tra JSON + ACL broker
        run: |
          python -c "import json; json.load(open('esp32/diagram.json')); print('diagram.json OK')"
          test -f broker/acl.conf && echo "ACL OK"
          test -f broker/config/mosquitto.conf && echo "Mosquitto config OK"

      - name: Sinh chung thu TLS (Lab2 - ma hoa)
        run: python broker/make_certs.py

      - name: Tao file passwd cho broker (xac thuc user/pass)
        run: |
          # File passwd KHONG commit len GitHub (security) -> CI tu sinh.
          docker run --rm -v "$PWD/broker/config:/work" \
            eclipse-mosquitto:2.0 mosquitto_passwd -b -c /work/passwd esp32 esp32123
          docker run --rm -v "$PWD/broker/config:/work" \
            eclipse-mosquitto:2.0 mosquitto_passwd -b /work/passwd app app123
          echo "--- passwd ---" && cat broker/config/passwd

      - name: Bat broker Mosquitto (4 listener: 1883/9001/8883 TLS/9002 WSS)
        run: |
          chmod 644 broker/config/passwd broker/config/acl.conf || true
          docker run -d --name parking-mosquitto-ci \
            -p 1883:1883 -p 9001:9001 -p 8883:8883 -p 9002:9002 \
            -v "$PWD/broker/config:/mosquitto/config:ro" \
            -v "$PWD/broker/config/certs:/mosquitto/config/certs:ro" \
            eclipse-mosquitto:2.0 \
            mosquitto -c /mosquitto/config/mosquitto.conf
          for i in $(seq 1 20); do
            if docker exec parking-mosquitto-ci mosquitto_sub -h localhost -p 1883 \
                 -u esp32 -P esp32123 -t 'health' -C 1 -W 2 2>/dev/null; then break; fi
            sleep 1
          done
          docker logs parking-mosquitto-ci 2>&1 | grep -E "Opening|running" || true

      - name: Bat backend
        run: |
          cd backend
          nohup node server.js > ../backend_ci.log 2>&1 &
          echo $! > ../backend.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -s http://localhost:3000/api/health

      - name: Chay bo kiem thu tu dong
        run: python simulator/test_suite.py

      - name: Kiem thu TLS rieng (Lab2 - ma hoa)
        run: python simulator/test_tls.py

      - name: Dung backend + broker
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
          docker rm -f parking-mosquitto-ci || true

      - name: Luu log backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend_ci.log

  build-app:
    name: Bundle React Native (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai dat phu thuoc
        working-directory: app
        run: npm ci

      - name: Kiem tra syntax JSX (7 file)
        working-directory: app
        run: node scripts/checkSyntax.js
