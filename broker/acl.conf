# ============================================================================
#  ACL - PHÂN QUYỀN TOPIC THEO USER (Lab 2 - Smart Parking)
#  ---------------------------------------------------------------------------
#  Nguyên tắc thiết kế:
#    - user "esp32"  : thiết bị ESP32 / simulator -> TOÀN QUYỀN trên parking/#
#                      (đọc cảm biến, ghi trạng thái ô, xuất hoá đơn...)
#    - user "app"    : App React Native -> CHỈ ĐỌC dữ liệu + ĐƯỢC GỬI LỆNH
#                      (đặt/hủy chỗ, mở/đóng cổng) nhưng KHÔNG được giả lập
#                      dữ liệu cảm biến hay giả hoá đơn.
#
#  GHI CHÚ QUAN TRỌNG VỀ CÁCH MOSQUITTO KIỂM TRA ACL:
#    Broker chặn PUBLISH khi KHÔNG có rule nào khớp topic.
#    Vì vậy với user "app", các topic trạng thái KHÔNG được khai báo rule
#    "write" -> app sẽ bị từ chối khi publish vào chúng.
# ============================================================================

# ------------------------------- ESP32 --------------------------------------
# Thiết bị đầu vào của hệ thống: đọc/ghi toàn bộ chủ đề trong parking/#
user esp32
topic readwrite parking/#
topic readwrite parking/system/#

# -------------------------------- APP ---------------------------------------
# App: chỉ được ĐỌC dữ liệu hiển thị + GỬI LỆNH điều khiển
user app
topic read parking/slot/+/status
topic read parking/slots/snapshot
topic read parking/booking/+/state
topic read parking/gate/barrier/state
topic read parking/gate/rfid
topic read parking/billing/receipt
topic read parking/system/heartbeat
topic read parking/system/status

# Lệnh điều khiển từ App (đặt chỗ / hủy chỗ / mở cổng)
topic write parking/booking/+/set
topic write parking/gate/barrier/cmd
