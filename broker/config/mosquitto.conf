# ============================================================================
#  MOSQUITO CONFIG - Lab2 (Smart Parking)
#  ---------------------------------------------------------------------------
#  4 cổng:
#    1883 - MQTT/TCP            (ESP32, simulator)
#    9001 - MQTT/WebSocket      (App React Native)
#    8883 - MQTT/TLS            (ESP32/simulator khi bật mã hoá)
#    9002 - MQTT/WebSocket/TLS  (App qua wss://)
#  + xác thực user/password + ACL phân quyền topic
# ============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
connection_messages true

# Client không khai báo ID -> tự tạo, cho phép App reconnect nhanh
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ------------------------------- MQTT / TCP ---------------------------------
listener 1883
protocol mqtt
max_queued_messages 500
max_inflight_messages 20

# ---------------------------- MQTT / WebSocket -----------------------------
listener 9001
protocol websockets
max_connections 100

# ------------------------------ MQTT / TLS ---------------------------------
# Ma hoa SSL/TLS - sinh chung thu bang: python broker/make_certs.py
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
require_certificate false
max_queued_messages 500

# ------------------------- MQTT / WebSocket / TLS --------------------------
listener 9002
protocol websockets
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
require_certificate false
max_connections 100