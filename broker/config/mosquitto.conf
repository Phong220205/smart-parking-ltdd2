# Lab2 - Mosquitto Broker cho Smart Parking
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
connection_messages true

# Client không khai báo ID -> tự tạo, cho phép App reconnect nhanh
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

listener 1883
protocol mqtt
max_queued_messages 500
max_inflight_messages 20

listener 9001
protocol websockets
max_connections 100
