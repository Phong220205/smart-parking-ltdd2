# ============================================================================
#  MOSQUITO CONFIG - BẢN DÀNH CHO DOCKER / RENDER (không dùng TLS)
#  ---------------------------------------------------------------------------
#  2 cổng:
#    1883 - MQTT/TCP            (ESP32 trên Wokwi, simulator, backend)
#    9001 - MQTT/WebSocket      (App React Native nếu nối thẳng broker)
#  + xác thực user/password + ACL phân quyền theo topic
#
#  KHÁC với broker/config/mosquitto.conf (bản chạy local có thêm cổng TLS
#  8883 / 9002). Bản này đơn giản hơn, không cần file chứng thư -> deploy
#  được lên Render dễ dàng hơn.
#
#  Mật khẩu (khớp với broker/config/passwd):
#    esp32 / esp32123  -> full quyền đọc/ghi parking/#
#    app   / app123    -> chỉ đọc dữ liệu, ghi lệnh booking/gate
# ============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
connection_messages true

# KHÔNG cho phép kết nối ẩn danh -> bắt buộc client phải đăng nhập
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ------------------------------- MQTT / TCP ---------------------------------
listener 1883
protocol mqtt
max_queued_messages 500
max_inflight_messages 20

# ---------------------------- MQTT / WebSocket -----------------------------
listener 9001
protocol websockets
max_connections 100
