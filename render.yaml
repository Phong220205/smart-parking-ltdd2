# ============================================================================
#  RENDER BLUEPRINT - DỰ ÁN BÃI ĐỖ XE THÔNG MINH (LTDD2)
#  ---------------------------------------------------------------------------
#  Render.yaml định nghĩa 2 dịch vụ:
#
#   1) smart-parking-ltdd2  -> Backend Node.js (API REST + Dashboard web +
#                             bridge MQTT/WebSocket cho App React Native)
#
#   2) smart-parking-broker -> MQTT Broker (Mosquitto) CÓ XÁC THỰC user/pass
#                             + ACL phân quyền theo topic
#
#  Mục đích của broker có auth:
#    - ESP32 (Lab 1) đăng nhập bằng user "esp32" -> được publish vào
#      parking/# và subscribe parking/booking/+/set, parking/gate/barrier/cmd
#    - App (Lab 3) đăng nhập bằng user "app" -> CHỈ ĐỌC được dữ liệu,
#      không publish giả được (chống spam/gian lận dữ liệu)
#    - Backend đăng nhập bằng user "esp32" (full quyền) để đọc/ghi
#  Đây chính là tiêu chí "xác thực & phân quyền" của Lab 2.
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # 1) BACKEND (Node.js) - API + Dashboard + Bridge MQTT-WS cho App
  # --------------------------------------------------------------------------
  - type: web
    name: smart-parking-ltdd2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      # Broker MQTT dùng chung cho toàn hệ thống.
      # - Backend trên Render tự chạy broker nội bộ (aedes) có xác thực +
      #   ACL phân quyền (xem backend/mqttAuthBroker.js), và expose nó ra
      #   ngoài qua MQTT-over-WebSocket tại /mqtt (wss://.../mqtt).
      # - ESP32 (Wokwi) và App (React Native) đều dùng chung broker này.
      # - Biến dưới đây dùng cho trường hợp chạy backend riêng lẻ (không
      #   bật broker nội bộ) - khi đó điền broker thật của nhóm.
      - key: MQTT_URL
        value: mqtt://test.mosquitto.org:1883
      - key: MQTT_USER
        value: esp32
      - key: MQTT_PASS
        value: esp32123
      - key: EMBED_BROKER
        value: "true"
      - key: EMBED_BROKER_PORT
        value: "1883"
      - key: EMBED_BROKER_WS_PORT
        value: "9001"
      - key: MQTT_WS_PATH
        value: /mqtt
      - key: JWT_SECRET
        value: smart-parking-ltdd2-jwt-secret-2026
      - key: ADMIN_PASS
        value: admin123
      - key: DATA_FILE
        value: /tmp/parking.json
