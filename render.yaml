services:
  - type: web
    name: smart-parking-ltdd2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: MQTT_URL
        value: mqtt://test.mosquitto.org:1883
      - key: MQTT_USER
        value: ""
      - key: MQTT_PASS
        value: ""
      - key: MQTT_WS_PATH
        value: /mqtt
      - key: JWT_SECRET
        value: smart-parking-ltdd2-jwt-secret-2026
      - key: ADMIN_PASS
        value: admin123
      - key: DATA_FILE
        value: /tmp/parking.json
